{% extends "base.html" %}

{% block title %}Vendors - {{ server_name }}{% endblock %}

{% block content %}
<div class="flex justify-between items-center mb-2 flex-wrap gap-3">
    <h1 class="text-3xl font-bold">🏪 Vendors</h1>
    <p class="text-base-content/60">Browse vendors selling pooches in {{ server_name }}</p>
</div>

<div id="loading" class="flex items-center gap-3 text-base-content/50 py-8 mt-4">
    <span class="loading loading-spinner loading-md"></span>
    <span>Loading vendors...</span>
</div>

<div id="vendors-container" style="display: none;" class="mt-4">
    <div id="vendors-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    <div id="no-vendors" class="text-center py-12 text-base-content/50" style="display: none;">
        <p>No vendors found in this server.</p>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
const PAGE_DATA = {
    serverId: {{ server_id }}
};

document.addEventListener('DOMContentLoaded', async function() {
    try {
        const response = await fetch('/api/vendors');
        const vendors = await response.json();

        document.getElementById('loading').style.display = 'none';
        document.getElementById('vendors-container').style.display = 'block';

        if (vendors.length === 0) {
            document.getElementById('no-vendors').style.display = 'block';
            return;
        }

        const grid = document.getElementById('vendors-grid');
        grid.innerHTML = vendors.map(vendor => createVendorCard(vendor)).join('');

    } catch (error) {
        document.getElementById('loading').innerHTML = '<span class="text-error">Failed to load vendors</span>';
        console.error('Error:', error);
    }
});

function formatMarkup(markup) {
    const pct = Math.round((markup - 1) * 100);
    const sign = pct >= 0 ? '+' : '';
    return `${sign}${pct}%`;
}

function createVendorCard(vendor) {
    const markupPct = Math.round((vendor.price_markup - 1) * 100);
    const markupClass = markupPct > 20 ? 'text-error' : markupPct < 0 ? 'text-success' : '';

    const wantedItems = [
        ...(vendor.desired_mutations || []).map(m => `<span class="text-xs rarity-text-${(m.rarity || '').toLowerCase()}">✨ ${escapeHtml(m.name)}</span>`),
        ...(vendor.desired_breeds || []).map(b => `<span class="text-xs rarity-text-${(b.rarity || '').toLowerCase()}">🐾 ${escapeHtml(b.name)}</span>`),
    ];
    const wantsHtml = wantedItems.length > 0
        ? `<div class="flex flex-wrap gap-1"><span class="text-xs text-base-content/50 mr-1">Wants:</span>${wantedItems.join('<span class="text-xs text-base-content/30">,</span> ')}</div>`
        : '';

    return `
        <a href="/vendor/${vendor.id}" class="card bg-base-200 shadow-md hover:-translate-y-1 hover:shadow-lg transition-all text-base-content no-underline h-full">
            <div class="card-body gap-3">
                <div class="flex justify-between items-start">
                    <h3 class="card-title text-lg">🏪 ${escapeHtml(vendor.name)}</h3>
                    <span class="badge badge-ghost badge-sm">${vendor.stock_count ?? 0} pooches</span>
                </div>
                <div class="flex gap-6 text-sm">
                    <div class="flex flex-col gap-0.5">
                        <span class="text-xs text-base-content/50 uppercase tracking-wide">Stock</span>
                        <span class="font-semibold">${vendor.stock_count ?? 0}</span>
                    </div>
                    <div class="flex flex-col gap-0.5">
                        <span class="text-xs text-base-content/50 uppercase tracking-wide">Markup</span>
                        <span class="font-semibold ${markupClass}">${formatMarkup(vendor.price_markup)}</span>
                    </div>
                </div>
                ${wantsHtml}
                <div class="card-actions mt-auto">
                    <span class="btn btn-primary btn-sm btn-block">Browse Pooches →</span>
                </div>
            </div>
        </a>
    `;
}
</script>
{% endblock %}
