{% extends "base.html" %}

{% block title %}Vendor - {{ server_name }}{% endblock %}

{% block content %}
<div class="flex justify-between items-center mb-6 flex-wrap gap-3">
    <a href="{{ url_for('vendor.vendors_list') }}" class="btn btn-ghost btn-sm">← Back to Vendors</a>
    <h1 class="text-3xl font-bold" id="vendor-name">Loading...</h1>
</div>

<div id="loading" class="flex items-center gap-3 text-base-content/50 py-8">
    <span class="loading loading-spinner loading-md"></span>
    <span>Loading vendor...</span>
</div>

<div id="vendor-container" style="display: none;">
    <div class="card bg-base-200 shadow-md mb-6">
        <div class="card-body py-4">
            <div id="vendor-details"></div>
        </div>
    </div>

    <h2 class="text-xl font-bold mb-4">Available Pooches</h2>
    <div id="pooches-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4"></div>
    <div id="no-pooches" class="text-center py-12 text-base-content/50" style="display: none;">
        <p>This vendor has no pooches available.</p>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
const PAGE_DATA = {
    vendorId: {{ vendor_id }}
};

document.addEventListener('DOMContentLoaded', async function() {
    try {
        const response = await fetch(`/api/vendors/${PAGE_DATA.vendorId}`);
        const vendor = await response.json();

        document.getElementById('loading').style.display = 'none';
        document.getElementById('vendor-container').style.display = 'block';

        document.getElementById('vendor-name').textContent = `🏪 ${vendor.name}`;

        // Vendor details
        document.getElementById('vendor-details').innerHTML = `
            <div class="flex gap-8">
                <div class="flex flex-col gap-0.5">
                    <span class="text-xs text-base-content/50 uppercase tracking-wide">Stock</span>
                    <span class="text-2xl font-black">${vendor.stock_count ?? 0}</span>
                    <span class="text-xs text-base-content/50">pooches</span>
                </div>
                <div class="flex flex-col gap-0.5">
                    <span class="text-xs text-base-content/50 uppercase tracking-wide">Price Markup</span>
                    <span class="text-2xl font-black">${formatMarkup(vendor.price_markup)}</span>
                </div>
            </div>
        `;

        // Load pooches
        const poochResponse = await fetch(`/api/vendors/${PAGE_DATA.vendorId}/pooches`);
        const pooches = await poochResponse.json();

        if (pooches.length === 0) {
            document.getElementById('no-pooches').style.display = 'block';
            return;
        }

        const grid = document.getElementById('pooches-grid');
        grid.innerHTML = pooches.map(pooch => createPoochCard(pooch)).join('');

    } catch (error) {
        document.getElementById('loading').innerHTML = '<span class="text-error">Failed to load vendor</span>';
        console.error('Error:', error);
    }
});

function formatMarkup(markup) {
    const pct = Math.round((markup - 1) * 100);
    const sign = pct >= 0 ? '+' : '';
    return `${sign}${pct}%`;
}

function createPoochCard(pooch) {
    const sexEmoji = pooch.sex === 'female' ? '♀️' : '♂️';
    const breedNames = pooch.breeds.map(b => b.breed.name).join(', ') || 'Unknown';
    const mutationsHtml = pooch.mutations.length > 0
        ? pooch.mutations.map((m, i) =>
            `<span class="rarity-text-${(m.rarity || '').toLowerCase()}">${escapeHtml(m.name)}${i < pooch.mutations.length - 1 ? ',' : ''}</span>`
          ).join(' ')
        : `<span>None</span>`;

    return `
        <div class="card bg-base-200 shadow-sm h-full">
            <div class="card-body py-4 px-4 gap-2">
                <div class="flex justify-between items-center">
                    <span class="font-bold">${escapeHtml(pooch.name)}</span>
                    <span>${sexEmoji}</span>
                </div>
                <div class="text-xs text-base-content/50 flex flex-col gap-0.5">
                    <div class="flex gap-2">
                        <span class="shrink-0">Age:</span><span>${pooch.age} days</span>
                    </div>
                    <div class="flex gap-2">
                        <span class="shrink-0">Breeds:</span><span class="text-base-content/70">${escapeHtml(breedNames)}</span>
                    </div>
                    <div class="flex gap-2">
                        <span class="shrink-0">Mutations:</span><span class="text-base-content/70">${mutationsHtml}</span>
                    </div>
                </div>
                <div class="mt-auto flex flex-col gap-2">
                    <div class="flex gap-2 text-success font-semibold text-sm">
                        <span>Price:</span><span>${formatCurrency(pooch.buy_price)}</span>
                    </div>
                    <button class="btn btn-primary btn-sm btn-block" onclick="buyPooch(${pooch.id})">Buy</button>
                </div>
            </div>
        </div>
    `;
}

async function buyPooch(poochId) {
    if (!confirm('Buy this pooch?')) return;

    try {
        const response = await fetch(`/api/vendors/${PAGE_DATA.vendorId}/buy/${poochId}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },        });

        const result = await response.json();

        if (result.success) {
            App.showNotification('Purchase successful!', 'success');
            window.location.href = '/kennel';
        } else {
            App.showNotification(result.message || result.error || 'Purchase failed', 'error');
        }
    } catch (error) {
        App.showNotification('Something went wrong. Please try again.', 'error');
        console.error('Error:', error);
    }
}
</script>
{% endblock %}
