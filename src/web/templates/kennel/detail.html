{% extends "base.html" %}

{% block title %}Kennel - Pooch Breeder{% endblock %}

{% block content %}
<div class="page-header">
    <h1 id="kennel-name">Loading...</h1>
    <div class="page-actions">
        <a href="{{ url_for('kennel.breeding_interface', kennel_id=kennel_id) }}" class="btn btn-primary">💕 Breed Pooches</a>
        <a href="{{ url_for('kennel.kennels_list') }}" class="btn btn-secondary">← Back to Kennels</a>
    </div>
</div>

<div class="loading" id="loading">Loading pooches...</div>

<div id="pooches-container" style="display: none;">
    <div class="kennel-info" id="kennel-info"></div>
    <div id="pooches-grid" class="pooches-grid"></div>
    <div id="no-pooches" class="empty-state" style="display: none;">
        <p>This kennel is empty. Visit the vendors to buy some pooches!</p>
        <a href="{{ url_for('vendor.vendors_list') }}" class="btn btn-primary">Visit Vendors</a>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
const PAGE_DATA = {
    kennelId: {{ kennel_id }}
};

document.addEventListener('DOMContentLoaded', async function() {
    try {
        // Load kennel info
        const kennelsResponse = await fetch('/api/kennels');
        const kennels = await kennelsResponse.json();
        const kennel = kennels.find(k => k.id === PAGE_DATA.kennelId);
        
        if (kennel) {
            document.getElementById('kennel-name').textContent = `🏠 ${kennel.name}`;
            document.getElementById('kennel-info').innerHTML = `
                <span class="capacity">Capacity: <strong id="pooch-count">-</strong> / ${kennel.pooch_limit}</span>
            `;
        }
        
        // Load pooches
        const response = await fetch(`/api/kennels/${PAGE_DATA.kennelId}/pooches`);
        const pooches = await response.json();
        
        document.getElementById('loading').style.display = 'none';
        document.getElementById('pooches-container').style.display = 'block';
        document.getElementById('pooch-count').textContent = pooches.length;
        
        if (pooches.length === 0) {
            document.getElementById('no-pooches').style.display = 'block';
            return;
        }
        
        const grid = document.getElementById('pooches-grid');
        grid.innerHTML = pooches.map(pooch => createPoochCard(pooch)).join('');
        
    } catch (error) {
        document.getElementById('loading').textContent = 'Failed to load kennel';
        console.error('Error:', error);
    }
});

function createPoochCard(pooch) {
    const statusEmoji = {
        'healthy': '💚',
        'sick': '🤒',
        'old': '👴',
        'dead': '💀'
    };
    
    const sexEmoji = pooch.sex === 'female' ? '♀️' : '♂️';
    
    const breedNames = pooch.breeds.map(b => b.breed.name).join(', ') || 'Unknown';
    
    return `
        <a href="/pooch/${pooch.id}" class="pooch-card status-${pooch.status}">
            <div class="pooch-header">
                <span class="pooch-name">${escapeHtml(pooch.name)}</span>
                <span class="pooch-sex">${sexEmoji}</span>
            </div>
            <div class="pooch-status">
                ${statusEmoji[pooch.status] || '❓'} ${pooch.status}
            </div>
            <div class="pooch-details">
                <div class="detail">
                    <span class="label">Age:</span>
                    <span class="value">${pooch.age} days</span>
                </div>
                <div class="detail">
                    <span class="label">Breeds:</span>
                    <span class="value">${escapeHtml(breedNames)}</span>
                </div>
                ${pooch.breeding_cooldown > 0 ? `
                <div class="detail cooldown">
                    <span class="label">Cooldown:</span>
                    <span class="value">${pooch.breeding_cooldown} days</span>
                </div>
                ` : ''}
            </div>
            ${pooch.mutations.length > 0 ? `
            <div class="pooch-mutations">
                ${pooch.mutations.map(m => `<span class="mutation-badge">${escapeHtml(m.name)}</span>`).join('')}
            </div>
            ` : ''}
        </a>
    `;
}
</script>
{% endblock %}
