{% extends "base.html" %}

{% block title %}Kennel - Pooch Breeder{% endblock %}

{% block content %}
<div class="flex justify-between items-center mb-6 flex-wrap gap-3">
    <h1 class="text-3xl font-bold" id="kennel-name">Loading...</h1>
    <div class="flex gap-2">
        <a href="{{ url_for('kennel.breeding_interface', kennel_id=kennel_id) }}" class="btn btn-primary btn-sm">💕 Breed Pooches</a>
        <a href="{{ url_for('kennel.kennels_list') }}" class="btn btn-ghost btn-sm">← Back to Kennels</a>
    </div>
</div>

<div id="loading" class="flex items-center gap-3 text-base-content/50 py-8">
    <span class="loading loading-spinner loading-md"></span>
    <span>Loading pooches...</span>
</div>

<div id="pooches-container" style="display: none;">
    <div class="mb-4 text-base-content/60 text-sm" id="kennel-info"></div>
    <div id="pooches-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4"></div>
    <div id="no-pooches" class="text-center py-12 text-base-content/50" style="display: none;">
        <p class="mb-3">This kennel is empty. Visit the vendors to buy some pooches!</p>
        <a href="{{ url_for('vendor.vendors_list') }}" class="btn btn-primary btn-sm">Visit Vendors</a>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
const PAGE_DATA = {
    kennelId: {{ kennel_id }}
};

document.addEventListener('DOMContentLoaded', async function() {
    try {
        // Load kennel info
        const kennelsResponse = await fetch('/api/kennels');
        const kennels = await kennelsResponse.json();
        const kennel = kennels.find(k => k.id === PAGE_DATA.kennelId);

        if (kennel) {
            document.getElementById('kennel-name').textContent = `🏠 ${kennel.name}`;
            document.getElementById('kennel-info').innerHTML = `
                Capacity: <strong id="pooch-count">-</strong> / ${kennel.pooch_limit}
            `;
        }

        // Load pooches
        const response = await fetch(`/api/kennels/${PAGE_DATA.kennelId}/pooches`);
        const pooches = await response.json();

        document.getElementById('loading').style.display = 'none';
        document.getElementById('pooches-container').style.display = 'block';
        document.getElementById('pooch-count').textContent = pooches.length;

        if (pooches.length === 0) {
            document.getElementById('no-pooches').style.display = 'block';
            return;
        }

        const grid = document.getElementById('pooches-grid');
        grid.innerHTML = pooches.map(pooch => createPoochCard(pooch)).join('');

    } catch (error) {
        document.getElementById('loading').innerHTML = '<span class="text-error">Failed to load kennel</span>';
        console.error('Error:', error);
    }
});

function createPoochCard(pooch) {
    const statusEmoji = {
        'healthy': '💚',
        'sick': '🤒',
        'old': '👴',
        'dead': '💀'
    };

    const sexEmoji = pooch.sex === 'female' ? '♀️' : '♂️';
    const breedNames = pooch.breeds.map(b => b.breed.name).join(', ') || 'Unknown';
    const mutationsHtml = pooch.mutations.length > 0
        ? pooch.mutations.map((m, i) =>
            `<span class="rarity-text-${(m.rarity || '').toLowerCase()}">${escapeHtml(m.name)}${i < pooch.mutations.length - 1 ? ',' : ''}</span>`
          ).join(' ')
        : `<span>None</span>`;

    return `
        <a href="/pooch/${pooch.id}" class="card bg-base-200 shadow-sm hover:-translate-y-1 hover:shadow-md transition-all text-base-content no-underline pooch-card status-${pooch.status}">
            <div class="card-body py-4 px-4 gap-2">
                <div class="flex justify-between items-center">
                    <span class="font-bold">${escapeHtml(pooch.name)}</span>
                    <span class="text-lg">${sexEmoji}</span>
                </div>
                <div class="text-sm text-base-content/60">
                    ${statusEmoji[pooch.status] || '❓'} ${pooch.status}
                </div>
                <div class="text-xs text-base-content/50 flex flex-col gap-0.5">
                    <div class="flex gap-2">
                        <span class="shrink-0">Age:</span><span>${pooch.age} days</span>
                    </div>
                    <div class="flex gap-2">
                        <span class="shrink-0">Breeds:</span><span class="text-base-content/70">${escapeHtml(breedNames)}</span>
                    </div>
                    <div class="flex gap-2">
                        <span class="shrink-0">Mutations:</span><span class="text-base-content/70">${mutationsHtml}</span>
                    </div>
                    ${pooch.breeding_cooldown > 0 ? `
                    <div class="flex gap-2 text-warning">
                        <span class="shrink-0">Cooldown:</span><span>${pooch.breeding_cooldown} days</span>
                    </div>
                    ` : ''}
                </div>
            </div>
        </a>
    `;
}
</script>
{% endblock %}
