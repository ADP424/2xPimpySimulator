{% extends "base.html" %}

{% block title %}Graveyard - Pooch Breeder{% endblock %}

{% block content %}
<div class="flex justify-between items-center mb-6 flex-wrap gap-3">
    <div>
        <h1 class="text-3xl font-bold">⛪ Graveyard</h1>
        <p class="text-base-content/60 mt-1">In memory of those who have passed.</p>
    </div>
    <a href="{{ url_for('main.town') }}" class="btn btn-ghost btn-sm">← Back to Town</a>
</div>

<div id="loading" class="flex items-center gap-3 text-base-content/50 py-8">
    <span class="loading loading-spinner loading-md"></span>
    <span>Loading graveyard...</span>
</div>

<div id="graveyard-container" style="display: none;">
    <div id="pooches-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4"></div>
    <div id="no-pooches" class="text-center py-16 text-base-content/50" style="display: none;">
        <p class="text-4xl mb-4">🌿</p>
        <p>No pooches have been buried here.</p>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
document.addEventListener('DOMContentLoaded', async function() {
    try {
        const response = await fetch('/api/graveyard');
        const pooches = await response.json();

        document.getElementById('loading').style.display = 'none';
        document.getElementById('graveyard-container').style.display = 'block';

        if (pooches.length === 0) {
            document.getElementById('no-pooches').style.display = 'block';
            return;
        }

        const grid = document.getElementById('pooches-grid');
        grid.innerHTML = pooches.map(pooch => createGraveyardCard(pooch)).join('');

    } catch (error) {
        document.getElementById('loading').innerHTML = '<span class="text-error">Failed to load graveyard.</span>';
        console.error('Error:', error);
    }
});

function createGraveyardCard(pooch) {
    const sexEmoji = pooch.sex === 'female' ? '♀️' : '♂️';
    const breedNames = (pooch.breeds || []).map(b => b.breed.name).join(', ') || 'Unknown';

    let buriedText = '—';
    if (pooch.buried_at) {
        const d = new Date(pooch.buried_at);
        buriedText = d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
    }

    const mutationsHtml = (pooch.mutations || []).length > 0
        ? `<div>
               <span class="text-xs text-base-content/50">Mutations: </span>${pooch.mutations.map((m, i) =>
                   `<span class="text-xs rarity-text-${(m.rarity || '').toLowerCase()}">${escapeHtml(m.name)}${i < pooch.mutations.length - 1 ? ',' : ''}</span>`
               ).join(' ')}
           </div>`
        : '';

    return `
        <a href="/pooch/${pooch.id}" class="card bg-base-200 shadow-sm hover:-translate-y-1 hover:shadow-md transition-all text-base-content no-underline pooch-card status-dead">
            <div class="card-body py-4 px-4 gap-2">
                <div class="flex justify-between items-center">
                    <span class="font-bold">${escapeHtml(pooch.name)}</span>
                    <span class="text-lg">${sexEmoji}</span>
                </div>
                <div class="text-xs text-base-content/50 flex flex-col gap-0.5">
                    <div class="flex justify-between gap-2">
                        <span class="shrink-0">Age at death:</span><span>${pooch.age} days</span>
                    </div>
                    <div class="flex gap-2">
                        <span class="shrink-0">Breeds:</span><span class="text-base-content/70">${escapeHtml(breedNames)}</span>
                    </div>
                    ${mutationsHtml}
                    <div class="flex justify-between gap-2">
                        <span class="shrink-0">Buried:</span><span>${buriedText}</span>
                    </div>
                </div>
            </div>
        </a>
    `;
}
</script>
{% endblock %}
