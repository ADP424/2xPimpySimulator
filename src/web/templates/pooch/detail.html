{% extends "base.html" %}

{% block title %}Pooch Details - Pooch Breeder{% endblock %}

{% block content %}
<div id="loading" class="flex items-center gap-3 text-base-content/50 py-8">
    <span class="loading loading-spinner loading-md"></span>
    <span>Loading pooch details...</span>
</div>

<div id="pooch-container" style="display: none;">
    <div class="flex justify-between items-center mb-6 flex-wrap gap-3">
        <div class="flex items-center gap-2">
            <h1 class="text-3xl font-bold" id="pooch-name">Loading...</h1>
            <button class="btn btn-ghost btn-xs" onclick="document.getElementById('rename-pooch-modal').showModal()" title="Rename">✏️</button>
        </div>
        <button onclick="history.back()" class="btn btn-ghost btn-sm">← Back</button>
    </div>

    <!-- Rename modal -->
    <dialog id="rename-pooch-modal" class="modal">
        <div class="modal-box">
            <h3 class="font-bold text-lg mb-4">Rename Pooch</h3>
            <input id="rename-pooch-input" type="text" maxlength="256" class="input w-full" placeholder="New name...">
            <div class="modal-action">
                <form method="dialog"><button class="btn btn-ghost btn-sm">Cancel</button></form>
                <button class="btn btn-primary btn-sm" onclick="submitRenamePooch()">Rename</button>
            </div>
        </div>
        <form method="dialog" class="modal-backdrop"><button>close</button></form>
    </dialog>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Basic Info Card -->
        <div class="card bg-base-200 shadow-md">
            <div class="card-body">
                <h2 class="card-title">Basic Info</h2>
                <div id="basic-info"></div>
            </div>
        </div>

        <!-- Breeds Card -->
        <div class="card bg-base-200 shadow-md">
            <div class="card-body">
                <h2 class="card-title">🐕 Breeds</h2>
                <div id="breeds-info"></div>
            </div>
        </div>

        <!-- Mutations Card -->
        <div class="card bg-base-200 shadow-md">
            <div class="card-body">
                <h2 class="card-title">🧬 Mutations</h2>
                <div id="mutations-info"></div>
            </div>
        </div>

        <!-- Family Card -->
        <div class="card bg-base-200 shadow-md">
            <div class="card-body">
                <div class="flex justify-between items-center">
                    <h2 class="card-title">👨‍👩‍👧 Family</h2>
                    <a href="/pooch/{{ pooch_id }}/family-tree" class="btn btn-ghost btn-xs">View Tree</a>
                </div>
                <div id="family-info"></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
const PAGE_DATA = {
    poochId: {{ pooch_id }}
};

document.addEventListener('DOMContentLoaded', async function() {
    try {
        // Load pooch details
        const poochResponse = await fetch(`/api/pooches/${PAGE_DATA.poochId}`);
        const pooch = await poochResponse.json();

        // Load family
        const familyResponse = await fetch(`/api/pooches/${PAGE_DATA.poochId}/family`);
        const family = await familyResponse.json();

        document.getElementById('loading').style.display = 'none';
        document.getElementById('pooch-container').style.display = 'block';

        renderPooch(pooch, family);

    } catch (error) {
        document.getElementById('loading').innerHTML = '<span class="text-error">Failed to load pooch details</span>';
        console.error('Error:', error);
    }
});

async function submitRenamePooch() {
    const name = document.getElementById('rename-pooch-input').value.trim();
    if (!name) return;

    try {
        const resp = await fetch(`/api/pooches/${PAGE_DATA.poochId}/rename`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name }),
        });
        const result = await resp.json();
        if (result.success) {
            App.queueNotification('Pooch renamed!', 'success');
            window.location.reload();
        } else {
            App.showNotification(result.error || 'Rename failed', 'error');
        }
    } catch (e) {
        App.showNotification('Something went wrong.', 'error');
        console.error('Error:', e);
    }
}

function renderPooch(pooch, family) {
    document.getElementById('pooch-name').textContent = `${pooch.sex === 'female' ? '♀️' : '♂️'} ${pooch.name}`;
    document.getElementById('rename-pooch-input').value = pooch.name;

    // Basic Info
    const statusEmoji = {
        'healthy': '💚 Healthy',
        'sick': '🤒 Sick',
        'old': '👴 Old',
        'dead': '💀 Dead'
    };

    const moodEmoji = {
        'happy': '😊 Happy',
        'excited': '🤪 Excited',
        'sleepy': '😴 Sleepy',
        'grumpy': '😤 Grumpy',
        'anxious': '😰 Anxious',
        'mischievous': '😈 Mischievous',
        'zoomies': '🏃 Zoomies',
        'hungry': '🍖 Hungry',
        'content': '😌 Content',
        'clingy': '🥺 Clingy',
        'dead': '💀 Dead'
    };

    document.getElementById('basic-info').innerHTML = `
        <div class="grid grid-cols-2 gap-3">
            <div class="flex flex-col gap-0.5">
                <span class="text-xs text-base-content/50 uppercase tracking-wide">Status</span>
                <span class="font-medium status-${pooch.status}">${statusEmoji[pooch.status]}</span>
            </div>
            <div class="flex flex-col gap-0.5">
                <span class="text-xs text-base-content/50 uppercase tracking-wide">Sex</span>
                <span class="font-medium">${pooch.sex === 'female' ? '♀️ Female' : '♂️ Male'}</span>
            </div>
            <div class="flex flex-col gap-0.5">
                <span class="text-xs text-base-content/50 uppercase tracking-wide">Age</span>
                <span class="font-medium">${pooch.age} days</span>
            </div>
            <div class="flex flex-col gap-0.5">
                <span class="text-xs text-base-content/50 uppercase tracking-wide">Health</span>
                <span class="font-medium">${pooch.health} / ${pooch.base_health}</span>
            </div>
            <div class="flex flex-col gap-0.5">
                <span class="text-xs text-base-content/50 uppercase tracking-wide">Breeding Cooldown</span>
                <span class="font-medium ${pooch.breeding_cooldown > 0 ? 'text-warning' : 'text-success'}">${pooch.breeding_cooldown > 0 ? pooch.breeding_cooldown + ' days' : 'Ready!'}</span>
            </div>
            <div class="flex flex-col gap-0.5">
                <span class="text-xs text-base-content/50 uppercase tracking-wide">Virgin</span>
                <span class="font-medium">${pooch.virgin ? 'Yes 💕' : 'No'}</span>
            </div>
            ${pooch.mood ? `
            <div class="flex flex-col gap-0.5">
                <span class="text-xs text-base-content/50 uppercase tracking-wide">Mood</span>
                <span class="font-medium">${moodEmoji[pooch.mood] || pooch.mood}</span>
            </div>
            ` : ''}
            ${pooch.birthday ? `
            <div class="flex flex-col gap-0.5">
                <span class="text-xs text-base-content/50 uppercase tracking-wide">Birthday</span>
                <span class="font-medium">${new Date(pooch.birthday).toLocaleDateString()}</span>
            </div>
            ` : ''}
        </div>
    `;

    // Breeds
    if (pooch.breeds && pooch.breeds.length > 0) {
        document.getElementById('breeds-info').innerHTML = `
            <div class="flex flex-col gap-2">
                ${pooch.breeds.map(bi => `
                    <a href="/info/breeds/${bi.breed.id}" class="flex justify-between items-center p-2 rounded-lg bg-base-300 hover:bg-base-100 transition-colors text-base-content no-underline">
                        <span class="font-medium text-sm">${escapeHtml(bi.breed.name)}</span>
                        <div class="flex items-center gap-2">
                            <span class="text-xs text-base-content/50">${(bi.relative_weight * 100).toFixed(0)}%</span>
                            <span class="rarity-badge rarity-${(bi.breed.rarity || '').toLowerCase()}">${escapeHtml(App.format.enumLabel(bi.breed.rarity))}</span>
                        </div>
                    </a>
                `).join('')}
            </div>
        `;
    } else {
        document.getElementById('breeds-info').innerHTML = '<p class="text-base-content/50 text-sm">No breed information available.</p>';
    }

    // Mutations
    if (pooch.mutations && pooch.mutations.length > 0) {
        document.getElementById('mutations-info').innerHTML = `
            <div class="flex flex-col gap-2">
                ${pooch.mutations.map(m => `
                    <a href="/info/mutations/${m.id}" class="flex justify-between items-center p-2 rounded-lg bg-base-300 hover:bg-base-100 transition-colors text-base-content no-underline health-${App.healthImpactGroup(m.health_impact)}">
                        <span class="font-medium text-sm">${escapeHtml(m.name)}</span>
                        <span class="text-xs text-base-content/50">${escapeHtml(App.format.enumLabel(m.health_impact))}</span>
                    </a>
                `).join('')}
            </div>
        `;
    } else {
        document.getElementById('mutations-info').innerHTML = '<p class="text-base-content/50 text-sm">No mutations.</p>';
    }

    // Family
    let familyHtml = '';

    if (family.parents && family.parents.length > 0) {
        familyHtml += `
            <div class="mb-4">
                <h4 class="text-xs text-base-content/50 uppercase tracking-wide mb-2">Parents</h4>
                <div class="flex flex-wrap gap-2">
                    ${family.parents.map(p => createFamilyMemberLink(p)).join('')}
                </div>
            </div>
        `;
    }

    if (family.siblings && family.siblings.length > 0) {
        familyHtml += `
            <div class="mb-4">
                <h4 class="text-xs text-base-content/50 uppercase tracking-wide mb-2">Siblings</h4>
                <div class="flex flex-wrap gap-2">
                    ${family.siblings.map(p => createFamilyMemberLink(p)).join('')}
                </div>
            </div>
        `;
    }

    if (family.children && family.children.length > 0) {
        familyHtml += `
            <div class="mb-4">
                <h4 class="text-xs text-base-content/50 uppercase tracking-wide mb-2">Children</h4>
                <div class="flex flex-wrap gap-2">
                    ${family.children.map(p => createFamilyMemberLink(p)).join('')}
                </div>
            </div>
        `;
    }

    if (!familyHtml) {
        familyHtml = '<p class="text-base-content/50 text-sm">No family members found.</p>';
    }

    document.getElementById('family-info').innerHTML = familyHtml;
}

function createFamilyMemberLink(pooch) {
    return `
        <a href="/pooch/${pooch.id}" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-base-300 hover:bg-base-100 transition-colors text-base-content no-underline text-sm">
            <span>${pooch.sex === 'female' ? '♀️' : '♂️'}</span>
            <span class="font-medium">${escapeHtml(pooch.name)}</span>
            <span>${pooch.alive ? '❤️' : '💀'}</span>
        </a>
    `;
}
</script>
{% endblock %}
