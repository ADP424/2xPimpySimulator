[project]
name = "pimpy_simulator"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "flask-session>=0.8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 120
target-version = ['py314']

[tool.flake8]
max-line-length = 120
extend-ignore = """
    E203
    E402
"""

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing --cov-config=.coveragerc"
asyncio_mode = "auto"
markers = [
    "contract: marks tests as contract/integration tests",
    "integration: marks tests as integration tests requiring external services",
]
filterwarnings = [
    "ignore::DeprecationWarning:discord",
    "ignore::DeprecationWarning:discord\\..*",
    "ignore:.*iscoroutinefunction.*:DeprecationWarning",
    "ignore::RuntimeWarning:asyncio",
    "ignore:coroutine.*was never awaited:RuntimeWarning",
]
